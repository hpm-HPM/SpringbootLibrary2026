<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知 · 图书馆管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" v-cloak>
    <header class="topbar" v-if="me">
        <div class="brand"><span class="logo">📚</span><div><div class="brand-name">图书馆管理系统</div><div class="brand-sub">消息通知</div></div></div>
        <div class="top-actions">
            <a class="notif-bell" href="notifications.html">🔔<span id="notif-count" class="notif-count"></span></a>
            <div class="top-user"><span class="avatar-sm">{{ me.name.slice(0, 1) }}</span><span class="user-name">{{ me.name }}</span><span class="badge" :class="Lib.roleClass(me.role)">{{ me.role }}</span></div>
            <button class="btn btn-outline btn-sm" @click="Lib.logout()">退出</button>
        </div>
    </header>

    <div class="layout" v-if="me">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
            <div class="page-head"><div><h2>消息通知</h2><p>预约图书可借、预约过期等系统消息会出现在这里。</p></div><button class="btn btn-outline btn-sm" @click="markAllRead" :disabled="unreadCount === 0">全部标为已读</button></div>

            <div class="card">
                <div class="card-head">
                    <div class="tabs" style="margin:0;border:0;">
                        <button class="tab" :class="{ active: tab === 'all' }" @click="switchTab('all')">全部消息</button>
                        <button class="tab" :class="{ active: tab === 'unread' }" @click="switchTab('unread')">未读 <span class="badge badge-danger" v-if="unreadCount > 0">{{ unreadCount }}</span></button>
                    </div>
                    <button class="btn btn-outline btn-sm" @click="load">刷新</button>
                </div>
                <div class="card-body" style="padding-top:0;">
                    <div class="loading" v-if="loading"><span class="spinner"></span>加载中…</div>
                    <div class="empty-state" v-else-if="rows.length === 0"><div class="empty-icon">🔔</div>{{ tab === 'unread' ? '没有未读消息。' : '暂无消息。' }}</div>
                    <div v-else class="notif-list">
                        <div class="notif-item" v-for="n in rows" :key="n.id" :class="{ unread: !n.isRead }" @click="open(n)">
                            <div class="notif-dot" v-if="!n.isRead"></div>
                            <div class="notif-body">
                                <div class="notif-title"><strong>{{ n.title }}</strong><span class="text-muted small">{{ Lib.fmt(n.createTime) }}</span></div>
                                <div class="notif-content">{{ n.content }}</div>
                                <div class="small text-muted" v-if="n.link">查看详情 →</div>
                            </div>
                            <button class="btn btn-ghost btn-sm" v-if="!n.isRead" @click.stop="markRead(n)">标为已读</button>
                        </div>
                    </div>
                    <div class="pagination" v-if="tab === 'all' && total > size">
                        <span class="page-total">第 {{ page }} / {{ totalPages }} 页</span>
                        <button class="btn btn-outline btn-sm" :disabled="page <= 1" @click="go(page - 1)">上一页</button>
                        <button class="btn btn-outline btn-sm" :disabled="page >= totalPages" @click="go(page + 1)">下一页</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    const { createApp, ref, computed, onMounted } = Vue;
    createApp({
        setup() {
            const me = ref(null);
            const tab = ref('all');
            const rows = ref([]);
            const page = ref(1);
            const size = ref(10);
            const total = ref(0);
            const loading = ref(false);
            const unreadCount = ref(0);
            const totalPages = computed(function () { return Math.max(1, Math.ceil(total.value / size.value)); });

            async function loadUnreadCount() {
                try { const res = await Lib.get('/notifications/unread-count'); unreadCount.value = Number(res.data || 0); Lib.refreshUnreadCount(); }
                catch (e) { unreadCount.value = 0; }
            }

            async function load() {
                loading.value = true;
                try {
                    if (tab.value === 'unread') {
                        const res = await Lib.get('/notifications/unread');
                        rows.value = res.data || []; total.value = rows.value.length;
                    } else {
                        const res = await Lib.get('/notifications', { page: page.value, size: size.value });
                        rows.value = res.data.content || []; total.value = res.data.total || 0;
                    }
                    await loadUnreadCount();
                } catch (e) { Lib.toast(Lib.errorMessage(e), 'error'); }
                finally { loading.value = false; }
            }

            function switchTab(value) { tab.value = value; page.value = 1; load(); }
            function go(p) { page.value = p; load(); }

            async function markRead(n) {
                if (n.isRead) return;
                try { await Lib.post('/notifications/' + n.id + '/read'); n.isRead = true; await loadUnreadCount(); if (tab.value === 'unread') rows.value = rows.value.filter(function (x) { return x.id !== n.id; }); }
                catch (e) { Lib.toast(Lib.errorMessage(e), 'error'); }
            }

            async function markAllRead() {
                try { await Lib.post('/notifications/read-all'); Lib.toast('已全部标为已读'); await load(); Lib.refreshUnreadCount(); }
                catch (e) { Lib.toast(Lib.errorMessage(e), 'error'); }
            }

            async function open(n) {
                if (!n.isRead) await markRead(n);
                if (n.link) location.href = n.link;
            }

            onMounted(async function () {
                try { me.value = await Lib.initPage('消息通知'); await load(); }
                catch (e) { Lib.toast(Lib.errorMessage(e), 'error'); }
            });

            return { me, tab, rows, page, size, total, loading, unreadCount, totalPages, load, switchTab, go, markRead, markAllRead, open, Lib };
        }
    }).mount('#app');
</script>
</body>
</html>
