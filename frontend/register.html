<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 图书馆管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" v-cloak>
    <div class="auth-page">
        <div class="auth-card" style="width:min(560px,100%);">
            <div class="brand"><span class="logo">📚</span> 创建账号</div>
            <h1>注册新用户</h1>
            <div class="subtitle">请选择角色，不同角色需要补充不同的信息</div>

            <form @submit.prevent="doRegister" autocomplete="off">
                <div class="form-grid">
                    <div class="field">
                        <label class="label">姓名 <em>*</em></label>
                        <input v-model.trim="form.name" class="input" maxlength="30" placeholder="登录用户名，不能重复">
                    </div>
                    <div class="field">
                        <label class="label">手机号 <em>*</em></label>
                        <input v-model.trim="form.phone" class="input" maxlength="11" placeholder="11 位手机号">
                    </div>
                    <div class="field">
                        <label class="label">密码 <em>*</em></label>
                        <input v-model="form.password" type="password" class="input" maxlength="20" placeholder="6-20 位">
                    </div>
                    <div class="field">
                        <label class="label">确认密码 <em>*</em></label>
                        <input v-model="form.confirmPassword" type="password" class="input" maxlength="20" placeholder="再次输入密码">
                    </div>
                    <div class="field">
                        <label class="label">角色 <em>*</em></label>
                        <select v-model="form.role" class="select">
                            <option value="学生">学生</option>
                            <option value="教师">教师</option>
                            <option value="操作员">操作员</option>
                            <option value="管理员">管理员</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="label">专业 <em>*</em></label>
                        <input v-model.trim="form.major" class="input" maxlength="30" placeholder="例如：计算机科学与技术">
                    </div>

                    <template v-if="form.role === '管理员'">
                        <div class="field">
                            <label class="label">权限级别</label>
                            <input v-model.number="form.permissionLevel" type="number" min="1" max="9" class="input" placeholder="1-9">
                        </div>
                        <div class="field">
                            <label class="label">入职日期</label>
                            <input v-model="form.entryTime" type="date" class="input">
                        </div>
                    </template>

                    <template v-if="form.role === '操作员'">
                        <div class="field">
                            <label class="label">工作区域</label>
                            <input v-model.trim="form.area" class="input" maxlength="30" placeholder="例如：一楼借阅区">
                        </div>
                        <div class="field">
                            <label class="label">岗位职责</label>
                            <input v-model.trim="form.duty" class="input" maxlength="30" placeholder="例如：图书整理">
                        </div>
                    </template>

                    <template v-if="form.role === '学生'">
                        <div class="field">
                            <label class="label">年级</label>
                            <input v-model.trim="form.grade" class="input" maxlength="20" placeholder="例如：2024级">
                        </div>
                        <div class="field">
                            <label class="label">学院</label>
                            <input v-model.trim="form.college" class="input" maxlength="30" placeholder="例如：计算机学院">
                        </div>
                    </template>

                    <template v-if="form.role === '教师'">
                        <div class="field">
                            <label class="label">学院</label>
                            <input v-model.trim="form.college" class="input" maxlength="30" placeholder="例如：文学院">
                        </div>
                        <div class="field">
                            <label class="label">职称</label>
                            <input v-model.trim="form.title" class="input" maxlength="30" placeholder="例如：副教授">
                        </div>
                    </template>
                </div>

                <div v-if="error" class="alert alert-danger">{{ error }}</div>
                <button type="submit" class="btn btn-primary btn-block" :disabled="loading">
                    <span v-if="loading" class="spinner"></span>{{ loading ? '提交中…' : '注 册' }}
                </button>
            </form>

            <div class="auth-foot">已有账号？<a href="login.html">返回登录</a></div>
        </div>
    </div>
</div>
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    const { createApp, reactive, ref, computed, onMounted } = Vue;
    createApp({
        setup() {
            const today = Lib.today();
            const form = reactive({
                name: '', phone: '', password: '', confirmPassword: '', role: '学生', major: '',
                permissionLevel: 1, entryTime: today, area: '', duty: '', grade: '', college: '', title: ''
            });
            const error = ref('');
            const loading = ref(false);

            function validate() {
                if (!form.name) return '请输入姓名';
                if (form.name.length > 30) return '姓名不能超过 30 个字符';
                if (!/^1[3-9]\d{9}$/.test(form.phone)) return '请输入正确的 11 位手机号';
                if (form.password.length < 6 || form.password.length > 20) return '密码长度应为 6-20 位';
                if (form.password !== form.confirmPassword) return '两次输入的密码不一致';
                if (!form.major) return '请输入专业';
                if (form.role === '管理员') {
                    if (!form.permissionLevel || form.permissionLevel < 1 || form.permissionLevel > 9) return '权限级别应为 1-9';
                }
                if (form.role === '操作员' && (!form.area || !form.duty)) return '请填写工作区域和岗位职责';
                if (form.role === '学生' && (!form.grade || !form.college)) return '请填写年级和学院';
                if (form.role === '教师' && (!form.college || !form.title)) return '请填写学院和职称';
                return '';
            }

            async function doRegister() {
                error.value = validate();
                if (error.value) return;
                loading.value = true;
                try {
                    const payload = {
                        name: form.name, password: form.password, phone: form.phone,
                        role: form.role, major: form.major
                    };
                    if (form.role === '管理员') {
                        payload.permissionLevel = form.permissionLevel;
                        payload.entryTime = form.entryTime || null;
                    } else if (form.role === '操作员') {
                        payload.area = form.area; payload.duty = form.duty;
                    } else if (form.role === '学生') {
                        payload.grade = form.grade; payload.college = form.college;
                    } else if (form.role === '教师') {
                        payload.college = form.college; payload.title = form.title;
                    }
                    await Lib.post('/auth/register', payload);
                    Lib.toast('注册成功，即将跳转登录');
                    setTimeout(function () { location.href = 'login.html'; }, 900);
                } catch (e) {
                    error.value = Lib.errorMessage(e);
                } finally {
                    loading.value = false;
                }
            }

            onMounted(function () {
                Lib.me().then(function (user) { if (user) location.replace('home.html'); }).catch(function () {});
            });

            return { form, error, loading, doRegister, Lib };
        }
    }).mount('#app');
</script>
</body>
</html>
