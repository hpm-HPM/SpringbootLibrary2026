server:
  port: 8081
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: SpringbootLibrary2026
  datasource:
    url: jdbc:mysql://localhost:3306/librarydb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: hpm060612HPM
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 现有表由 librarydb.sql 维护；新增表由 sql/schema.sql 维护，避免 Hibernate 自动改列。
      ddl-auto: none
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
    show-sql: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload-dir: uploads
  cors:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"

logging:
  level:
    com.library: INFO
    org.hibernate.SQL: WARN